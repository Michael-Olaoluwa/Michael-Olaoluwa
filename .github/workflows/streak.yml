name: Update contribution streak

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate streak card
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/streak.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --staged --quiet || git commit -m "chore: update streak card"
          git push
